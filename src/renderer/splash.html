<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>VelixLITE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
      user-select: none;
    }

    .splash {
      position: relative;
      width: 420px;
      height: 280px;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #A97D2E;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      background: linear-gradient(180deg, #FFFDF5 0%, #FBEFC9 35%, #F3D989 70%, #E7C36A 100%);
    }

    .potato {
      position: absolute;
      border-radius: 50% 45% 55% 48% / 55% 50% 48% 45%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,0.55), rgba(255,255,255,0) 40%),
        radial-gradient(circle at 70% 65%, #8a5a20 0 6%, transparent 7%),
        radial-gradient(circle at 40% 70%, #8a5a20 0 5%, transparent 6%),
        radial-gradient(circle at 60% 30%, #8a5a20 0 4%, transparent 5%),
        radial-gradient(circle at 25% 55%, #8a5a20 0 3.5%, transparent 4.5%),
        linear-gradient(160deg, #E8C26E, #C6912F 60%, #A9762A);
      box-shadow: inset -4px -6px 10px rgba(0,0,0,0.25), inset 3px 4px 6px rgba(255,255,255,0.35);
      opacity: 0.9;
      animation: drift 6s ease-in-out infinite;
    }

    .potato.p1 { width: 46px; height: 34px; top: 18px;  left: 24px;  animation-duration: 7s; }
    .potato.p2 { width: 30px; height: 24px; top: 40px;  right: 30px; animation-duration: 5.5s; animation-delay: .4s; }
    .potato.p3 { width: 26px; height: 20px; bottom: 60px; left: 40px; animation-duration: 6.5s; animation-delay: .8s; }
    .potato.p4 { width: 38px; height: 28px; bottom: 40px; right: 50px; animation-duration: 8s; animation-delay: .2s; }
    .potato.p5 { width: 20px; height: 16px; top: 90px; left: 90px; animation-duration: 5s; animation-delay: 1.1s; opacity: 0.6; }
    .potato.p6 { width: 22px; height: 18px; top: 70px; right: 90px; animation-duration: 6s; animation-delay: .6s; opacity: 0.6; }
    .potato.p7 { width: 16px; height: 13px; bottom: 100px; left: 160px; animation-duration: 5.2s; animation-delay: .3s; opacity: 0.5; }
    .potato.p8 { width: 18px; height: 14px; bottom: 20px; right: 140px; animation-duration: 7.2s; animation-delay: .9s; opacity: 0.5; }

    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(8deg); }
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
    }

    .logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(80, 50, 0, 0.35));
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .name {
      font-size: 22px;
      font-weight: 800;
      color: #5C3E12;
      text-shadow: 0 1px 0 rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
    }

    .tagline {
      font-size: 11px;
      color: #7A5A22;
      opacity: 0.85;
      margin-top: -6px;
    }

    .bar-outer {
      width: 220px;
      height: 14px;
      margin-top: 8px;
      border-radius: 7px;
      background: #FBF3DC;
      border: 1px solid #B98A34;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.25);
    }

    .bar-inner {
      height: 100%;
      width: 40%;
      border-radius: 7px;
      background: linear-gradient(180deg, #FFE9A8, #E4A93B 55%, #C88A2E);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
      animation: marquee 1.3s ease-in-out infinite;
    }

    @keyframes marquee {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }

    .loading-text {
      font-size: 10px;
      color: #7A5A22;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="potato p1"></div>
    <div class="potato p2"></div>
    <div class="potato p3"></div>
    <div class="potato p4"></div>
    <div class="potato p5"></div>
    <div class="potato p6"></div>
    <div class="potato p7"></div>
    <div class="potato p8"></div>

    <div class="content">
      <img class="logo" src="icon.png" alt="VelixLITE">
      <div class="name">VelixLITE</div>
      <div class="tagline">Lightweight Minecraft Launcher</div>
      <div class="bar-outer"><div class="bar-inner"></div></div>
      <div class="loading-text">Peeling assets...</div>
    </div>
  </div>
</body>
</html>
